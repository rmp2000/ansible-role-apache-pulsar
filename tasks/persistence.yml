---
- name: Stage an unconsumed durable message
  ansible.builtin.command:
    argv: [/opt/apache-pulsar-client/bin/python, /usr/local/bin/apache-pulsar-verify, stage]
    stdin: "{{ {'host':apache_pulsar_bind_address,'broker_port':apache_pulsar_broker_port,'admin_port':apache_pulsar_admin_port,'namespace':apache_pulsar_tenant ~ '/' ~ apache_pulsar_namespace} | to_json }}"

- name: Restart Apache Pulsar for the persistence test
  ansible.builtin.systemd:
    name: apache-pulsar
    state: restarted

- name: Read and acknowledge the original durable message after restart
  ansible.builtin.command:
    argv: [/opt/apache-pulsar-client/bin/python, /usr/local/bin/apache-pulsar-verify, check]
    stdin: "{{ {'host':apache_pulsar_bind_address,'broker_port':apache_pulsar_broker_port,'admin_port':apache_pulsar_admin_port,'namespace':apache_pulsar_tenant ~ '/' ~ apache_pulsar_namespace} | to_json }}"
  register: apache_pulsar_persistence
  retries: 24
  delay: 5
  until: apache_pulsar_persistence.rc == 0

- name: Report persistence verification
  ansible.builtin.debug:
    msg: APACHE_PULSAR_PERSISTENCE_OK
